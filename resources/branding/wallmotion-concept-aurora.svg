<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- macOS Drop Shadow Filters -->
    <filter id="ambient-shadow" x="-10%" y="-10%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="32" in="SourceAlpha" result="blur1" />
      <feOffset dx="0" dy="30" in="blur1" result="offset1" />
      <feComponentTransfer in="offset1" result="shadow1">
        <feFuncA type="linear" slope="0.32" />
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="14" in="SourceAlpha" result="blur2" />
      <feOffset dx="0" dy="14" in="blur2" result="offset2" />
      <feComponentTransfer in="offset2" result="shadow2">
        <feFuncA type="linear" slope="0.22" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow1" />
        <feMergeNode in="shadow2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glowing Aurora Filter -->
    <filter id="aurora-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="tile-bg" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#141829" />
      <stop offset="45%" stop-color="#0E1220" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>

    <linearGradient id="rim-stroke" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.12" />
    </linearGradient>

    <linearGradient id="inner-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.30" />
    </linearGradient>

    <!-- Aurora Wave Gradients -->
    <linearGradient id="wave-deep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3A1C71" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#D76D77" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFAF7B" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="wave-magenta" x1="0.1" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0%" stop-color="#4A00E0" />
      <stop offset="40%" stop-color="#8E2DE2" />
      <stop offset="70%" stop-color="#F000FF" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>

    <linearGradient id="wave-cyan" x1="0" y1="0.8" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="45%" stop-color="#4364F7" />
      <stop offset="75%" stop-color="#6FB1FC" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <linearGradient id="wave-highlight" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="35%" stop-color="#E0F7FF" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#00F2FE" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="aurora-core" cx="0.45" cy="0.48" r="0.45">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#7F00FF" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#141829" stop-opacity="0" />
    </radialGradient>

    <!-- Squircle Clip Path (macOS standard 824x824 at (100,100) with r=185) -->
    <clipPath id="squircle-clip">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185" />
    </clipPath>
  </defs>

  <!-- Ambient Shadow and Base Squircle Tile -->
  <g filter="url(#ambient-shadow)">
    <!-- Base Squircle -->
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#tile-bg)" />
  </g>

  <!-- Clipped Artwork Elements Inside Squircle -->
  <g clip-path="url(#squircle-clip)">
    <!-- Ambient Radial Glow Behind Waves -->
    <circle cx="480" cy="520" r="420" fill="url(#aurora-core)" />
    <circle cx="680" cy="380" r="280" fill="#E100FF" opacity="0.18" filter="url(#soft-glow)" />
    <circle cx="340" cy="620" r="260" fill="#00D2FF" opacity="0.22" filter="url(#soft-glow)" />

    <!-- Wave Layer 1: Deep Violet & Crimson Ambient Wave -->
    <path d="M60 760 C 240 780, 360 620, 520 640 C 680 660, 780 780, 960 720 L 960 960 L 60 960 Z"
          fill="url(#wave-magenta)" opacity="0.55" filter="url(#aurora-glow)" />

    <!-- Wave Layer 2: Oceanic Cobalt & Electric Violet Flow -->
    <path d="M80 680 C 260 520, 420 740, 600 580 C 740 460, 840 540, 960 500 L 960 960 L 80 960 Z"
          fill="url(#wave-magenta)" opacity="0.75" />

    <!-- Wave Layer 3: Main Dynamic Aurora Wave (Cyan -> Blue -> Violet) -->
    <path d="M80 580 C 280 410, 430 680, 640 460 C 760 330, 860 380, 960 320 L 960 960 L 80 960 Z"
          fill="url(#wave-cyan)" opacity="0.92" />

    <!-- Crest High-energy Ridge -->
    <path d="M80 575 C 280 405, 430 675, 640 455 C 760 325, 860 375, 960 315 L 960 345 C 860 405, 760 355, 640 485 C 430 705, 280 435, 80 605 Z"
          fill="url(#wave-highlight)" opacity="0.85" filter="url(#aurora-glow)" />

    <!-- Translucent Front Kinetic Wave (Glass Ribbon) -->
    <path d="M80 470 C 290 320, 450 560, 660 360 C 780 250, 880 290, 960 250 L 960 410 C 880 450, 780 410, 660 520 C 450 720, 290 480, 80 630 Z"
          fill="url(#wave-highlight)" opacity="0.45" />

    <!-- Subtle Particle Constellations / Fluid Droplets (Retina micro-details) -->
    <circle cx="360" cy="380" r="3.5" fill="#FFFFFF" opacity="0.7" />
    <circle cx="410" cy="340" r="2" fill="#00F2FE" opacity="0.9" />
    <circle cx="480" cy="390" r="3" fill="#FFFFFF" opacity="0.6" />
    <circle cx="620" cy="310" r="4" fill="#FFFFFF" opacity="0.8" filter="url(#aurora-glow)" />
    <circle cx="690" cy="270" r="2.5" fill="#00F2FE" opacity="0.7" />
    <circle cx="750" cy="330" r="3" fill="#E100FF" opacity="0.8" />
    <circle cx="280" cy="460" r="3" fill="#00F2FE" opacity="0.6" />
    <circle cx="560" cy="460" r="2.5" fill="#FFFFFF" opacity="0.5" />

    <!-- Tactile Glass Surface Reflections (macOS HIG styling) -->
    <rect x="100" y="100" width="824" height="824" fill="url(#inner-glass)" />

    <!-- Top Soft Highlight Oval (Physical Glass Curvature) -->
    <ellipse cx="512" cy="180" rx="360" ry="120" fill="#FFFFFF" opacity="0.06" />
  </g>

  <!-- Precise macOS Rim Highlight Stroke -->
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" ry="184.5"
        fill="none" stroke="url(#rim-stroke)" stroke-width="2" pointer-events="none" />
</svg>
