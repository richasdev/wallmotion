<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- macOS Native Squircle Clip (824x824 at 100,100 with r=185) -->
    <clipPath id="squircle-clip">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185" />
    </clipPath>

    <!-- Rim highlight minimalista monocromático -->
    <linearGradient id="rim-stroke" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <!-- Base Squircle Tile (Sem Shadowing) -->
  <g clip-path="url(#squircle-clip)">
    <!-- 1. PRETO: Fundo sólido profundo, minimalista -->
    <rect x="100" y="100" width="824" height="824" fill="#0A0B10" />

    <!-- ======================================================== -->
    <!-- 2. BRANCO: O "W" NO CANTO SUPERIOR ESQUERDO (~25% ÁREA)   -->
    <!-- Camada atrás da aurora: o corpo fica no preto puro, e a  -->
    <!-- ponta inferior das pernas fica escondida pela aurora.     -->
    <!-- ======================================================== -->
    <g id="monogram-w">
      <path d="M 215 230
               L 282 505
               L 350 345
               L 418 505
               L 485 230"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="28"
            stroke-linecap="round"
            stroke-linejoin="round" />
    </g>

    <!-- ======================================================== -->
    <!-- 3 & 4. DUAS LINHAS DE AURORA (BELAS CURVAS, MAIS ABAIXO)  -->
    <!-- Ciano (#00F2FE) e Violeta (#7F00FF)                      -->
    <!-- Cruzando a base do W com curvas orgânicas de Bézier      -->
    <!-- Sem shadowing, fluxo cinético elegante                   -->
    <!-- ======================================================== -->

    <!-- Linha 2: Violeta Aurora (Curva fluida inferior) -->
    <path d="M 70 640
             C 180 670, 250 560, 380 550
             C 520 540, 580 700, 720 705
             C 820 710, 895 640, 954 600"
          fill="none"
          stroke="#7F00FF"
          stroke-width="28"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Linha 1: Ciano Aurora (Curva fluida superior cobrindo a base do W) -->
    <path d="M 70 565
             C 180 595, 245 485, 375 480
             C 510 475, 585 625, 725 630
             C 825 635, 895 565, 954 525"
          fill="none"
          stroke="#00F2FE"
          stroke-width="28"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>

  <!-- Borda de contorno squircle discreta e minimalista -->
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" ry="184.5"
        fill="none" stroke="url(#rim-stroke)" stroke-width="1.5" pointer-events="none" />
</svg>
