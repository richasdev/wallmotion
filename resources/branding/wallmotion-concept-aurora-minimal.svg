<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- macOS Native Squircle Clip (824x824 at 100,100 with r=185) -->
    <clipPath id="squircle-clip">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185" />
    </clipPath>

    <!-- Linhas de Aurora com gradiente muito suave e sutil (sem forçar degradê) -->
    <linearGradient id="aurora-cyan" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#00C4FF" />
    </linearGradient>

    <linearGradient id="aurora-violet" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#7F00FF" />
      <stop offset="100%" stop-color="#9D4EDD" />
    </linearGradient>

    <!-- Rim highlight minimalista monocromático -->
    <linearGradient id="rim-stroke" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Base Squircle Tile (Sem Shadowing) -->
  <g clip-path="url(#squircle-clip)">
    <!-- 1. PRETO: Fundo sólido profundo, minimalista -->
    <rect x="100" y="100" width="824" height="824" fill="#0A0B10" />

    <!-- ======================================================== -->
    <!-- 2. BRANCO: O "W" NO CANTO SUPERIOR ESQUERDO (~25% ÁREA)   -->
    <!-- Camada atrás da aurora: o topo fica visível, a base      -->
    <!-- fica escondida atrás das linhas de aurora. Sem shadow.   -->
    <!-- ======================================================== -->
    <g id="monogram-w">
      <path d="M 215 225
               L 282 485
               L 350 335
               L 418 485
               L 485 225"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="28"
            stroke-linecap="round"
            stroke-linejoin="round" />
    </g>

    <!-- ======================================================== -->
    <!-- 3 & 4. AS DUAS LINHAS DE AURORA (CIANO E VIOLETA)        -->
    <!-- Passando NA FRENTE do W, cobrindo a parte inferior dele  -->
    <!-- Sem shadowing, fluxo dinâmico e suave                    -->
    <!-- ======================================================== -->

    <!-- Linha 2: Violeta Aurora (Fita inferior) -->
    <path d="M 70 595
             C 240 500, 360 540, 520 480
             C 680 420, 800 470, 954 430"
          fill="none"
          stroke="url(#aurora-violet)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Linha 1: Ciano Aurora (Fita superior, cruzando o W) -->
    <path d="M 70 525
             C 240 435, 360 475, 520 415
             C 680 355, 800 405, 954 365"
          fill="none"
          stroke="url(#aurora-cyan)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>

  <!-- Borda de contorno squircle discreta e minimalista -->
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" ry="184.5"
        fill="none" stroke="url(#rim-stroke)" stroke-width="1.5" pointer-events="none" />
</svg>
