<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Wallmotion — waves on your desktop</title>
  <desc>A graphite monitor filled edge to edge with flowing cyan, teal and coral waves, on a mineral-glass macOS tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F0F7F6"/><stop offset="0.55" stop-color="#DCEBEA"/><stop offset="1" stop-color="#B9D0D1"/></linearGradient>
    <linearGradient id="frame" x2="0" y2="1"><stop stop-color="#46545A"/><stop offset="0.4" stop-color="#25363E"/><stop offset="1" stop-color="#16262E"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0D5266"/><stop offset="1" stop-color="#102D49"/></linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFD2A0"/><stop offset="0.45" stop-color="#FF8C83"/><stop offset="1" stop-color="#DE527A"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9DFFF0"/><stop offset="0.4" stop-color="#34E0D6"/><stop offset="1" stop-color="#1397AC"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1FB6B9"/><stop offset="1" stop-color="#073C63"/></linearGradient>
    <linearGradient id="stand" x2="0" y2="1"><stop stop-color="#60777C"/><stop offset="1" stop-color="#2C454E"/></linearGradient>
    <linearGradient id="rim" x2="0" y2="1"><stop stop-color="#FFFFFF" stop-opacity="0.95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.18"/></linearGradient>
    <clipPath id="screenClip"><rect x="200" y="262" width="624" height="410" rx="32"/></clipPath>
    <filter id="shadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse"><feGaussianBlur in="SourceAlpha" stdDeviation="11"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <g id="monitor" filter="url(#shadow)">
    <path d="M456 690 H568 L582 795 H442 Z" fill="url(#stand)"/>
    <rect x="350" y="792" width="324" height="32" rx="16" fill="url(#frame)"/>
    <rect id="monitorBezel" x="176" y="238" width="672" height="470" rx="54" fill="url(#frame)"/>
    <g clip-path="url(#screenClip)">
      <rect x="200" y="262" width="624" height="410" fill="url(#screen)"/>
      <path id="coralWave" d="M200 440 C324 292 438 352 544 418 C650 484 742 384 824 310 L824 672 H200 Z" fill="url(#coral)"/>
      <path id="cyanWave" d="M200 526 C326 372 424 462 536 516 C654 574 752 458 824 416 L824 672 H200 Z" fill="url(#cyan)"/>
      <path id="tealWave" d="M200 622 C334 490 438 562 550 592 C656 620 744 530 824 520 L824 672 H200 Z" fill="url(#teal)"/>
      <g id="fineDetails" fill="none" stroke-linecap="round">
        <path d="M200 439 C324 291 438 351 544 417 C650 483 742 383 824 309" stroke="#FFE5BE" stroke-opacity="0.65" stroke-width="3"/>
        <path d="M200 525 C326 371 424 461 536 515 C654 573 752 457 824 415" stroke="#BEFFF3" stroke-opacity="0.8" stroke-width="3"/>
        <path d="M200 621 C334 489 438 561 550 591 C656 619 744 529 824 519" stroke="#69EDE0" stroke-opacity="0.5" stroke-width="2"/>
      </g>
    </g>
    <rect id="screenRim" x="201" y="263" width="622" height="408" rx="31" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
    <rect id="powerLight" x="500" y="685" width="24" height="4" rx="2" fill="#8DEADD"/>
  </g>
  <rect id="tileRim" x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="url(#rim)" stroke-width="2"/>
</svg>
