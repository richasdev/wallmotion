<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Wallmotion</title>
  <desc>A luminous rounded W above a teal horizon, on a graphite macOS tile.</desc>
  <defs>
    <linearGradient id="tile" x2="0" y2="1"><stop stop-color="#30373B"/><stop offset="1" stop-color="#101719"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38D6CF"/><stop offset="0.48" stop-color="#148D94"/><stop offset="1" stop-color="#16444F"/></linearGradient>
    <linearGradient id="silver" x2="0.3" y2="1"><stop stop-color="#FFFFFF"/><stop offset="0.55" stop-color="#EFFAF8"/><stop offset="1" stop-color="#ACD7D4"/></linearGradient>
    <linearGradient id="rim" x2="0" y2="1"><stop stop-color="#FFFFFF" stop-opacity="0.5"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.18"/></linearGradient>
    <clipPath id="tileClip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse"><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="14"/><feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <g clip-path="url(#tileClip)">
    <g id="horizon">
      <path d="M100 707 C270 624 381 809 566 756 C717 713 805 633 924 673 L924 924 H100Z" fill="url(#water)"/>
      <path d="M100 707 C270 624 381 809 566 756 C717 713 805 633 924 673" fill="none" stroke="#87EEE2" stroke-opacity="0.62" stroke-width="3"/>
    </g>
    <path id="mark" d="M244 356 L342 636 C354 671 383 676 404 642 L492 489 Q512 455 532 489 L620 642 C641 676 670 671 682 636 L780 356" fill="none" stroke="url(#silver)" stroke-width="78" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="url(#rim)" stroke-width="2"/>
</svg>
