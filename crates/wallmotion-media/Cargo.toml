[package]
name = "wallmotion-media"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gif = { version = "=0.14.2", default-features = false, features = ["std", "raii_no_panic"] }

[lib]
crate-type = ["staticlib", "rlib"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
